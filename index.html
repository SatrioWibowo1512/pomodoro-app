<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism Pomodoro</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="glass-card">
    <div class="mode-buttons">
      <button class="mode-btn active" id="work-btn">Work</button>
      <button class="mode-btn" id="break-btn">Break</button>
    </div>

    <div class="session-info" id="session-info">0/4 SESSIONS</div>

    <div class="timer-display" id="timer">25:00</div>

    <div class="control-buttons">
      <button id="start-btn" class="btn">BEGIN</button>
      <button id="reset-btn" class="btn">RESET</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
